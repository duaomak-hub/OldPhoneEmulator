[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OldPhoneEmulator"
version = "1.0.0"
description = "Cross-platform Symbian OS / Nokia OS emulator supporting any ROM, Windows EXE, Linux ELF, disk images, with iconic keypad and app launcher"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name="OldPhoneEmulator Team"}]
keywords = ["symbian", "nokia", "emulator", "s60", "rom", "sis", "jar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
    "Operating System :: OS Independent"
]
dependencies = [
    "flask>=2.3.0",
    "Pillow>=10.0.0"
]

[project.optional-dependencies]
full = ["unicorn>=2.0.0", "capstone>=5.0", "PySide6>=6.5", "pygame>=2.5"]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/duaomak-hub/OldPhoneEmulator"
Repository = "https://github.com/duaomak-hub/OldPhoneEmulator"
Issues = "https://github.com/duaomak-hub/OldPhoneEmulator/issues"

[project.scripts]
oldphoneemulator = "main:main"
ope = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emulator*"]

[tool.setuptools.package-data]
emulator = ["ui/web/templates/*.html", "ui/web/static/*"]
